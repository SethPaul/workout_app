name: Android

# Builds the Capacitor Android app (app/android) and uploads the APK.
# Signed with the release key when the ANDROID_KEYSTORE_* secrets are set
# (see app/ANDROID.md); otherwise a debug APK is produced. Publishing a
# GitHub release with a tag like `v0.2.0` also attaches the APK to it.

on:
  pull_request:
    paths: ['app/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Must increase for an install to upgrade in place (keeping its data).
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Build web bundle and sync into the Android project
        run: npm run android:sync

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.path != ''
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/workout-$VERSION_NAME.apk"

      - name: Build debug APK (no release keystore configured)
        if: steps.keystore.outputs.path == ''
        working-directory: app/android
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/workout-$VERSION_NAME-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: workout-android-${{ env.VERSION_NAME }}
          path: ${{ runner.temp }}/workout-*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/workout-*.apk
